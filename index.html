<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio">
    <meta name="author" content="Lia Matsubara">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <link rel="icon" href="./assets/img/amarelo.png"/>

    <!-- Link para a folha de estilo css -->
    <link rel="stylesheet" href="./assets/css/styles.css">

    <title>Lia's Portfolio</title>
</head>
<body>

    <!-- Cabeçalho da Página -->
    <header class="flex menu_container">

        <div id="header_content" class="menu_content">

            <!-- Titulo do Menu -->
            <div id="titulo">
                <a href="#">Lia Matsubara</a>
            </div>

            <!-- Menu -->
            <div id="menu" class="flex">

                <nav>
                    <!-- Marcadores não ordenados -->
                     <ul class="flex menu_list">
                        <li><a href="#">Home</a></li>
                        <li><a href="#about">Sobre</a></li>
                        <li><a href="#contact">Contato</a></li>
                     </ul>
                </nav>

            </div>
        </div>

    </header>

    <!-- Seção Principal da Página -->
    <main>

        <!-- Seção Home -->
        <section id="home" class="flex home_container">
            <article id="home_texto" class="flex home_content">

                <h4>Olá! Bem-vindo ao meu mundo!</h4>
                <h1>Sou uma desenvolvedora Full Stack apaixonada por tecnologia</h1>
                <!-- <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Deserunt, iure. Doloribus quasi possimus qui, ipsam quisquam impedit illo totam in, a eius, necessitatibus quae corrupti velit sapiente eveniet magnam ipsum.</p> -->
                <a href="https://github.com/liamatsubara" target="_blank" class="botao">
                    Explorar
                </a>
            </article>

            <article id="home_imagem" class="home_content">
                <img src="./assets/img/Self confidence.gif" alt="Capacete de Astronauta Animado">
            </article>
        </section>

        <!-- Seção sobre -->
        <section id="about" class="flex sobre_container">
            
        </section>

        <!-- Seção de contato -->
        <section id="contact" class="contato_container">

            <article id="redes_sociais" class="flex contato_content">

                <h4>Contate-me</h4>
                <p>Venha se conectar comigo nas redes abaixo ou através do e-mail :)</p>

                <div id="icones_redes_sociais" class="social_container">
                    <a href="https://www.linkedin.com/in/liamatsubara/" target="_blank">
                        <img src="./assets/img/linkedin.svg" alt="Logo do Linkedin" class="social_icon">
                    </a>
                    <a href="https://github.com/liamatsubara" target="_blank">
                        <img src="./assets/img/github.svg" alt="Logo do Github" class="social_icon">
                    </a>
                    <a href="" target="_blank">
                        <img src="./assets/img/instagram.svg" alt="Logo do Instagram" class="social_icon">
                    </a>
                </div>
            </article>

            <!-- Formulário de Contato -->
            <form action="https://formsubmit.co/d12e44e5a51312de392ce9ebf77b62cb" method="POST" id="formulario">

                <input type="hidden" name="_next" value="http://127.0.0.1:5500/sucess.html">
                <input type="hidden" name="_captcha" value="false">

                <label for="nome">Nome</label>
                <input id="nome" type="text" name="nome" placeholder="Digite o seu nome">
                <span id="txtNome"></span>

                <label for="email">E-mail</label>
                <input id="email" type="text" name="email" placeholder="Digite o endereço do seu e-mail">
                <span id="txtEmail"></span>

                <label for="assunto">Assunto</label>
                <input id="assunto" type="text" name="assunto" placeholder="Digite o assunto da mensagem">
                <span id="txtAssunto"></span>

                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" placeholder="Digite a sua mensagem">
                </textarea>

                <button type="submit" class="botao">Enviar</button>
            </form>

        </section>
    </main>

    <!-- Rodapé da Página -->
    <footer>
        Feito com 💛 por Lia Matsubara - 2025
    </footer>

    <!-- Script JavaScript -->
    <script src="./assets/js/script.js"></script>

</body>
</html>
